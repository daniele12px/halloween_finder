<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Moderatore · Halloween Guidizzolo</title>
  <style>
    :root { --bg:#0f0c1b; --card:#231c3d; --line:#3b3058; --orange:#ff7800; --text:#fff; --muted:#c4bfd6; --red:#e74c3c; --green:#2ecc71; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { color: var(--orange); margin: 0 0 4px; }
    h2 { margin: 28px 0 10px; font-size: 20px; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    input[type=password] { width:100%; font:inherit; color:#fff; background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px 14px; }
    button { font:inherit; font-weight:700; border-radius:12px; border:2px solid var(--orange); background:var(--orange); color:#fff; padding:10px 16px; cursor:pointer; }
    button.ghost { background:transparent; color:#fff; border-color:var(--line); }
    button.danger { background:rgba(231,76,60,.15); border-color:var(--red); color:#ff7675; }
    button.ok { background:rgba(46,204,113,.15); border-color:var(--green); color:#6ee7a0; }
    button:disabled { opacity:.5; cursor:default; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
    .error { color:#ff7675; font-weight:700; margin:10px 0 0; }
    .card { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
    .card.flag { border-color: var(--red); }
    .card h3 { margin:0 0 2px; font-size:19px; color:var(--orange); }
    .meta { color:var(--muted); font-size:15px; margin:2px 0; }
    .badge { display:inline-block; font-size:13px; font-weight:800; border-radius:999px; padding:3px 10px; margin-left:8px; vertical-align:middle; }
    .badge.hidden-b { background:rgba(231,76,60,.2); color:#ff7675; }
    .badge.count { background:rgba(255,120,0,.2); color:#ffb066; }
    .reports { margin:10px 0 0; padding:10px 12px; background:rgba(0,0,0,.25); border-radius:10px; font-size:15px; }
    .reports div { margin:3px 0; }
    .actions { margin-top:12px; }
    a { color:#ffb066; }
    .empty { color:var(--muted); padding:8px 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>🛡️ Moderatore</h1>
    <p class="sub">Area riservata di Halloween Guidizzolo. Qui controlli le case segnalate dagli utenti.</p>

    <section id="login">
      <label for="key">Password del moderatore</label>
      <p></p>
      <input type="password" id="key" autocomplete="current-password">
      <p class="row"><button id="enter" type="button">Entra</button></p>
      <p id="loginError" class="error" hidden></p>
    </section>

    <section id="panel" hidden>
      <div class="bar">
        <strong id="summary"></strong>
        <span class="row">
          <button id="reload" class="ghost" type="button">Aggiorna</button>
          <button id="logout" class="ghost" type="button">Esci</button>
        </span>
      </div>
      <h2>Da controllare</h2>
      <div id="review"></div>
      <h2>Tutte le altre case</h2>
      <div id="others"></div>
    </section>
  </main>

  <script src="/moderatore.js"></script>
</body>
</html>
