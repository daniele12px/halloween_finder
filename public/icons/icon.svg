<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pumpkinGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="70%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#cc4400" />
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff99" />
      <stop offset="100%" stop-color="#ffcc00" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle dark spooky -->
  <rect width="512" height="512" rx="128" fill="#110e1b"/>
  <circle cx="256" cy="270" r="210" fill="#201735" />

  <!-- Pumpkin Stem -->
  <path d="M245 130 C240 85, 275 60, 290 55 C285 75, 275 105, 260 135 Z" fill="#4a7c29" stroke="#2d4d16" stroke-width="4" stroke-linejoin="round"/>

  <!-- Pumpkin body -->
  <g id="pumpkin">
    <!-- Back lobes -->
    <ellipse cx="170" cy="285" rx="75" ry="145" fill="url(#pumpkinGrad)" />
    <ellipse cx="342" cy="285" rx="75" ry="145" fill="url(#pumpkinGrad)" />
    <ellipse cx="210" cy="290" rx="80" ry="155" fill="url(#pumpkinGrad)" />
    <ellipse cx="302" cy="290" rx="80" ry="155" fill="url(#pumpkinGrad)" />
    <ellipse cx="256" cy="295" rx="85" ry="160" fill="url(#pumpkinGrad)" />

    <!-- Carved Eyes -->
    <polygon points="185,230 225,270 170,275" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <polygon points="327,230 287,270 342,275" fill="url(#eyeGlow)" filter="url(#glow)"/>

    <!-- Carved Nose -->
    <polygon points="256,280 270,305 242,305" fill="url(#eyeGlow)" filter="url(#glow)"/>

    <!-- Carved Spooky Smile -->
    <path d="M170 340 Q256 425 342 340 Q315 375 295 350 Q285 385 256 360 Q227 385 217 350 Q197 375 170 340 Z" fill="url(#eyeGlow)" filter="url(#glow)"/>
  </g>
</svg>
